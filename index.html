<!doctype html>
<html><head><meta charset="utf-8"><title>Catalogue Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:13px system-ui,sans-serif;display:grid;grid-template-columns:270px 1fr 250px;grid-template-rows:42px 1fr;height:100vh;background:#d8d6d0;color:#222}
header{grid-column:1/4;background:#1f2937;display:flex;gap:6px;align-items:center;padding:0 10px;color:#fff}
header b{margin-right:auto}
button{padding:5px 9px;border:1px solid #bbb;border-radius:5px;background:#fff;cursor:pointer}
header button{background:#374151;color:#fff;border-color:#4b5563}
.side{background:#f7f6f3;overflow:auto;padding:10px}
#stage{overflow:hidden;display:flex;align-items:center;justify-content:center;min-width:0}
#canvas{box-shadow:0 2px 14px #0005}
label{display:block;margin:6px 0 2px;font-size:11px;color:#555}
input:not([type=checkbox]):not([type=color]),textarea,select{width:100%;padding:4px;border:1px solid #bbb;border-radius:4px;font:inherit}
textarea{height:64px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button.on,.row.on{background:#1f2937;color:#fff}
.row{padding:6px;border-radius:4px;cursor:pointer;border:1px solid #ddd;margin:3px 0;background:#fff}
.sw{width:22px;height:22px;padding:0;border-radius:50%}
.pg{position:relative;overflow:hidden;break-after:page}
.pg:last-child{break-after:auto}
.el{position:absolute;box-sizing:border-box;overflow:hidden}
.el img{pointer-events:none}
#canvas .el[data-id]{cursor:move}
.sel{outline:.4mm dashed #2563eb}
.hd{position:absolute;right:0;bottom:0;width:3mm;height:3mm;background:#2563eb;cursor:nwse-resize}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0001;color:#888;font:10pt sans-serif}
#print{display:none}
@media print{body{display:block;height:auto;background:none}.ui{display:none!important}#print{display:block}.ph{display:none}}
</style></head><body>
<header class="ui"><b>Catalogue Maker</b>
<button onclick="openP()">Open</button><button onclick="saveP()">Save as</button>
<button onclick="pdf()">Export PDF</button><button onclick="api.update()">Check for updates</button></header>
<aside class="side ui" id="L"></aside>
<main id="stage" class="ui"><div id="canvas"></div></main>
<aside class="side ui" id="R"></aside>
<div id="print"></div><style id="pgs"></style>
<script>
const PX=3.7795,$=s=>document.querySelector(s);
let S={brand:{c1:'#7a1f1f',c2:'#e8a317',c3:'#fff8ec',font:'Arial',bodyFont:'Arial',logo:'',phone:'+91-0000000000',email:'support@example.com',web:'www.example.com',fssai:'',insta:''},size:{w:210,h:297},products:[],pages:[]};
let cur=0,sel=null,selP=null,tab='pages',fonts=['Arial'],Z=1,tm,lastSize;
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=c=>c&&c[0]=='@'?S.brand['c'+c[1]]:c||'#000';
const fnt=f=>`'${f=='@h'?S.brand.font:(!f||f=='@b')?S.brand.bodyFont:f}'`;
const tk=s=>(s||'').replace(/\{(\w+)\}/g,(m,k)=>S.brand[k]??m);
const selEl=()=>S.pages[cur].els.find(e=>e.id==sel);
const selProd=()=>S.products.find(p=>p.id==selP);
const root=()=>({brand:S.brand,size:S.size,el:selEl()||{},page:S.pages[cur],prod:selProd()||{}});
const get=k=>{const[a,b]=k.split('.');return root()[a][b]};
const set=(k,v)=>{const[a,b]=k.split('.');root()[a][b]=v};

function defaults(){const E=o=>({id:uid(),...o});return[
{name:'Cover',type:'free',bg:'@1',els:[E({t:'rect',x:0,y:200,w:210,h:97,bg:'@2'}),E({t:'logo',x:70,y:40,w:70,h:40}),
 E({t:'text',x:15,y:110,w:180,h:40,text:'Product Catalogue',size:38,color:'@3',bold:1,align:'center',font:'@h'}),
 E({t:'text',x:15,y:155,w:180,h:15,text:'Premium quality, packed fresh',size:16,color:'@3',align:'center',font:'@b'}),
 E({t:'text',x:15,y:270,w:180,h:10,text:'{web}',size:12,color:'@1',align:'center',font:'@b',bold:1})]},
{name:'About Us',type:'free',bg:'@3',els:[E({t:'text',x:15,y:20,w:180,h:18,text:'About Us',size:28,color:'@1',bold:1,align:'left',font:'@h'}),
 E({t:'rect',x:15,y:40,w:30,h:1.5,bg:'@2'}),
 E({t:'text',x:15,y:50,w:180,h:80,text:'Write about your brand here: who you are, what you make and why customers trust you.',size:13,color:'#333',align:'left',font:'@b'}),
 E({t:'image',x:15,y:140,w:180,h:110,src:''})]},
{name:'Products',type:'prod',title:'Our Products',layout:2,ids:[],bg:'@3',els:[]},
{name:'Contact',type:'free',bg:'@1',els:[E({t:'text',x:15,y:80,w:180,h:25,text:'Thank You',size:36,color:'@3',bold:1,align:'center',font:'@h'}),
 E({t:'text',x:15,y:125,w:180,h:60,text:'Phone: {phone}\nEmail: {email}\nWeb: {web}\nFSSAI: {fssai}\nInstagram: {insta}',size:14,color:'@3',align:'center',font:'@b'})]}]}

function elHTML(e){let st=`left:${e.x}mm;top:${e.y}mm;width:${e.w}mm;height:${e.h}mm;`,inner='';
 if(e.t=='rect')st+=`background:${col(e.bg)};`;
 if(e.t=='text'){st+=`font:${e.bold?700:400} ${e.size}pt ${fnt(e.font)};color:${col(e.color)};text-align:${e.align||'left'};`;inner=esc(tk(e.text)).replace(/\n/g,'<br>')}
 if(e.t=='image'||e.t=='logo'){const s=e.t=='logo'?S.brand.logo:e.src;inner=s?`<img src="${s}" style="width:100%;height:100%;object-fit:${e.t=='logo'?'contain':'cover'}">`:`<div class="ph">${e.t=='logo'?'Logo':'Image'}</div>`}
 return `<div class="el" data-id="${e.id}" style="${st}">${inner}</div>`}

function prodHTML(p){const n=+p.layout||2,W=S.size.w,H=S.size.h,m=10,top=26,land=W>H;
 const cols=n==1?1:n==2?(land?2:1):2,rows=n==1?1:n==2?(land?1:2):2,gw=(W-2*m)/cols,gh=(H-top-14)/rows,fs=n==1?18:n==2?14:11;
 let h=`<div class="el" style="left:0;top:0;width:${W}mm;height:20mm;background:${col('@1')}"></div><div class="el" style="left:${m}mm;top:4mm;width:${W-2*m-40}mm;height:12mm;font:700 20pt ${fnt('@h')};color:${col('@3')}">${esc(tk(p.title))}</div>`
 +(S.brand.logo?`<img class="el" src="${S.brand.logo}" style="left:${W-m-30}mm;top:3mm;width:30mm;height:14mm;object-fit:contain">`:'')
 +`<div class="el" style="left:${m}mm;top:${H-9}mm;width:${W-2*m}mm;height:6mm;font:9pt ${fnt('@b')};color:${col('@1')};text-align:center">${esc(tk('{web}  |  {phone}  |  {email}'))}</div>`;
 (p.ids||[]).map(id=>S.products.find(x=>x.id==id)).filter(Boolean).slice(0,n).forEach((q,i)=>{
  h+=`<div class="el" style="left:${m+(i%cols)*gw}mm;top:${top+Math.floor(i/cols)*gh}mm;width:${gw-4}mm;height:${gh-4}mm;background:#fff;border:.4mm solid ${col('@2')};border-radius:3mm;padding:3mm;display:flex;flex-direction:column;gap:1.5mm;font-family:${fnt('@b')}">
  <div style="flex:1;min-height:0">${q.img?`<img src="${q.img}" style="width:100%;height:100%;object-fit:contain">`:''}</div>
  <div style="font:700 ${fs}pt ${fnt('@h')};color:${col('@1')}">${esc(q.name)}</div>
  <div style="font-size:${fs-4}pt;color:#666;font-weight:700">${esc(q.cat)}</div>
  <div style="font-size:${fs-4}pt">${esc(q.desc)}</div>
  <div style="font-size:${fs-4}pt;color:#333">${esc(q.variants).replace(/\n/g,'<br>')}</div></div>`});
 return h}

const pageHTML=p=>`<div class="pg" style="width:${S.size.w}mm;height:${S.size.h}mm;background:${col(p.bg)}">${p.type=='prod'?prodHTML(p):''}${p.els.map(elHTML).join('')}</div>`;

function draw(){const c=$('#stage'),W=S.size.w,H=S.size.h;
 Z=Math.max(.1,Math.min((c.clientWidth-40)/(W*PX),(c.clientHeight-40)/(H*PX)));
 const cv=$('#canvas');cv.style.zoom=Z;cv.innerHTML=pageHTML(S.pages[cur]);
 const s=cv.querySelector(`[data-id="${sel}"]`);if(s){s.classList.add('sel');s.insertAdjacentHTML('beforeend','<i class="hd"></i>')}
 clearTimeout(tm);tm=setTimeout(()=>api.save(JSON.stringify(S)),800)}

const F=(l,k,t='text')=>{const v=get(k)??'';return `<label>${l}${t=='textarea'?`<textarea data-k="${k}">${esc(v)}</textarea>`:`<input data-k="${k}" type="${t}" step="any" ${t=='checkbox'?(v?'checked':''):`value="${esc(v)}"`}>`}</label>`};
const SEL=(l,k,o,num)=>`<label>${l}<select data-k="${k}" ${num?'data-num="1"':''}>${o.map(([v,n])=>`<option value="${esc(v)}" ${String(get(k))==String(v)?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;
const C=(l,k)=>`<label>${l}</label><div style="display:flex;gap:4px;align-items:center">${[1,2,3].map(i=>`<button class="sw" style="background:${S.brand['c'+i]}" title="Brand colour ${i}" onclick="setK('${k}','@${i}')"></button>`).join('')}<input type="color" data-k="${k}" value="${col(get(k))}"></div>`;
const FO=()=>fonts.map(f=>[f,f]);

function L(){const T=(k,n)=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';panel()">${n}</button>`;
 let h=`<div class="tabs">${T('pages','Pages')}${T('prods','Products')}${T('brand','Brand')}</div>`;
 if(tab=='pages')h+=S.pages.map((p,i)=>`<div class="row ${i==cur?'on':''}" onclick="go(${i})">${i+1}. ${esc(p.name)}</div>`).join('')
  +`<p><button onclick="addPg(0)">+ Free page</button> <button onclick="addPg(1)">+ Product page</button></p><p><button onclick="mv(-1)">Up</button> <button onclick="mv(1)">Down</button> <button onclick="delPg()">Delete page</button></p><b>Page size (mm)</b>`+F('Width','size.w','number')+F('Height','size.h','number');
 if(tab=='prods')h+=`<button onclick="addProd()">+ Add product</button> <button onclick="imp()">Import Excel/CSV</button>`
  +S.products.map(p=>`<div class="row ${p.id==selP?'on':''}" onclick="selP='${p.id}';panel()">${esc(p.name||'(new)')}</div>`).join('')
  +(selProd()?F('Name','prod.name')+F('Category','prod.cat')+F('Description','prod.desc','textarea')+F('Sizes & prices (one per line)','prod.variants','textarea')+`<p><button onclick="img(selProd(),'img')">Choose image</button> <button onclick="delProd()">Delete</button></p>`:'<p>Excel/CSV columns: name, category, description, variants</p>');
 if(tab=='brand')h+=`<p><button onclick="img(S.brand,'logo')">Choose logo</button></p>`+F('Colour 1','brand.c1','color')+F('Colour 2','brand.c2','color')+F('Colour 3','brand.c3','color')
  +SEL('Heading font','brand.font',FO())+SEL('Body font','brand.bodyFont',FO())+F('Phone','brand.phone')+F('Email','brand.email')+F('Website','brand.web')+F('FSSAI no.','brand.fssai')+F('Instagram','brand.insta')
  +'<p>In any text, type {phone} {email} {web} {fssai} {insta} to insert these automatically.</p>';
 $('#L').innerHTML=h}

function R(){const p=S.pages[cur],e=selEl();let h='<b>Page</b>'+F('Name','page.name')+C('Background','page.bg');
 if(p.type=='prod')h+=F('Heading','page.title')+SEL('Products per page','page.layout',[[1,'1'],[2,'2'],[4,'4']],1)+`<label>Products on this page</label>`+S.products.map(x=>`<div><input type="checkbox" ${(p.ids||[]).includes(x.id)?'checked':''} onchange="tog('${x.id}')"> ${esc(x.name)}</div>`).join('');
 h+=`<p><button onclick="addEl('text')">+ Text</button> <button onclick="addEl('image')">+ Image</button> <button onclick="addEl('rect')">+ Box</button></p>`;
 if(e){h+='<hr>';
  if(e.t=='text')h+=F('Text','el.text','textarea')+F('Size (pt)','el.size','number')+SEL('Font','el.font',[['@h','Brand heading'],['@b','Brand body'],...FO()])+C('Colour','el.color')+F('Bold','el.bold','checkbox')+SEL('Align','el.align',[['left','Left'],['center','Center'],['right','Right']]);
  if(e.t=='rect')h+=C('Fill','el.bg');
  if(e.t=='image')h+=`<p><button onclick="img(selEl())">Choose image</button></p>`;
  if(e.t=='logo')h+='<p>The logo comes from the Brand tab.</p>';
  h+=['x','y','w','h'].map(k=>F(k.toUpperCase()+' (mm)','el.'+k,'number')).join('')+`<p><button onclick="delEl()">Delete</button></p>`}
 $('#R').innerHTML=h}
const panel=()=>{L();R()};

const go=i=>{cur=i;sel=null;panel();draw()};
const setK=(k,v)=>{set(k,v);draw();panel()};
const tog=id=>{const p=S.pages[cur];p.ids=p.ids||[];const i=p.ids.indexOf(id);i<0?p.ids.push(id):p.ids.splice(i,1);draw()};
function addPg(prod){S.pages.splice(cur+1,0,prod?{name:'Products',type:'prod',title:'Our Products',layout:2,ids:[],bg:'@3',els:[]}:{name:'Page',type:'free',bg:'@3',els:[]});go(cur+1)}
const mv=d=>{const j=cur+d;if(j<0||j>=S.pages.length)return;[S.pages[cur],S.pages[j]]=[S.pages[j],S.pages[cur]];go(j)};
const delPg=()=>{if(S.pages.length>1&&confirm('Delete this page?')){S.pages.splice(cur,1);go(Math.max(0,cur-1))}};
function addEl(t){const e={id:uid(),t,x:20,y:20,w:t=='text'?100:60,h:t=='text'?15:40,...(t=='text'?{text:'New text',size:16,color:'@1',font:'@b',align:'left'}:t=='rect'?{bg:'@2'}:{src:''})};S.pages[cur].els.push(e);sel=e.id;panel();draw()}
const delEl=()=>{S.pages[cur].els=S.pages[cur].els.filter(e=>e.id!=sel);sel=null;panel();draw()};
async function img(o,k='src'){const d=await api.img();if(d){o[k]=d;draw();panel()}}
function addProd(){const p={id:uid(),name:'New product',cat:'',desc:'',variants:'',img:''};S.products.push(p);selP=p.id;panel()}
function delProd(){S.products=S.products.filter(p=>p.id!=selP);S.pages.forEach(p=>p.ids&&(p.ids=p.ids.filter(i=>i!=selP)));selP=null;panel();draw()}
async function imp(){const r=await api.sheet();if(!r)return;
 r.forEach(o=>{const g=n=>{const k=Object.keys(o).find(x=>x.trim().toLowerCase()==n);return k?String(o[k]):''};
  S.products.push({id:uid(),name:g('name'),cat:g('category'),desc:g('description'),variants:g('variants').replace(/\s*[|;]\s*/g,'\n'),img:''})});panel();draw()}

async function pdf(){$('#pgs').textContent=`@page{size:${S.size.w}mm ${S.size.h}mm;margin:0}`;
 $('#print').innerHTML=S.pages.map(pageHTML).join('');const r=await api.pdf();if(r)alert('PDF saved:\n'+r)}
async function openP(){const j=await api.open();if(j){S=JSON.parse(j);cur=0;sel=null;lastSize={...S.size};panel();draw()}}
const saveP=()=>api.saveAs(JSON.stringify(S));

document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.value;
 if(e.target.type=='checkbox')v=e.target.checked?1:0;else if(e.target.type=='number'||e.target.dataset.num)v=+v;
 set(k,v);draw()});
document.addEventListener('change',e=>{if(e.target.dataset.k?.startsWith('size.')){
 const a=S.size.w/lastSize.w,b=S.size.h/lastSize.h;
 S.pages.forEach(p=>p.els.forEach(x=>{x.x*=a;x.w*=a;x.y*=b;x.h*=b}));lastSize={...S.size};draw()}});
$('#canvas').addEventListener('mousedown',e=>{
 const el=e.target.closest('[data-id]'),o=el&&selEl&&S.pages[cur].els.find(x=>x.id==el.dataset.id);
 if(!o){sel=null;panel();draw();return}
 sel=o.id;const rs=e.target.className=='hd',sx=e.clientX,sy=e.clientY,ox=o.x,oy=o.y,ow=o.w,oh=o.h,r1=v=>Math.round(v*10)/10;
 const mvf=m=>{const dx=(m.clientX-sx)/(PX*Z),dy=(m.clientY-sy)/(PX*Z);
  if(rs){o.w=r1(Math.max(5,ow+dx));o.h=r1(Math.max(3,oh+dy))}else{o.x=r1(ox+dx);o.y=r1(oy+dy)}draw()};
 const up=()=>{removeEventListener('mousemove',mvf);removeEventListener('mouseup',up);panel()};
 addEventListener('mousemove',mvf);addEventListener('mouseup',up);panel();draw();e.preventDefault()});
addEventListener('resize',draw);
(async()=>{try{fonts=(await api.fonts()).sort()}catch{}
 const j=await api.load();if(j)S=JSON.parse(j);else S.pages=defaults();
 lastSize={...S.size};panel();draw()})();
</script></body></html>
