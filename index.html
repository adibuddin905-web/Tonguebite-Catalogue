<!doctype html>

<style>

<script>
const PX=3.7795,$=s=>document.querySelector(s);

/* images are kept at full original quality; blob URLs only make redraws fast */

 E({t:'rect',x:0,y:0,w:90,h:120,bg:'#ffffff',bc:'@2',bw:.4,r:3}),E({t:'pimg',x:4,y:4,w:82,h:58,fit:'contain',r:2}),
 E({t:'pf',f:'name',x:4,y:65,w:82,h:10,size:14,color:'@1',bold:1,align:'left',font:'@h'}),
 E({t:'pf',f:'cat',x:4,y:75,w:82,h:6,size:8,color:'#666666',bold:1,align:'left',font:'@b'}),

 for(let i=0;i<n;i++)els.push(E({t:'slot',i:i+1,x:r1(m+(i%cols)*gw+2),y:r1(top+Math.floor(i/cols)*gh+2),w:r1(gw-4),h:r1(gh-4)}));

{name:'Cover',type:'free',bg:'@1',els:[E({t:'rect',x:0,y:200,w:210,h:97,bg:'@2'}),E({t:'logo',x:70,y:40,w:70,h:40,lock:1}),

{name:'Contact',type:'free',bg:'@1',els:[E({t:'text',x:15,y:80,w:180,h:25,text:'Thank You',size:36,color:'@3',bold:1,align:'center',font:'@h'}),

document.addEventListener('change',e=>{if(/^el\.r[1-4]?$/.test(e.target.dataset.k||''))panel();if(e.target.dataset.k?.startsWith('size.')){
 const a=S.size.w/lastSize.w,b=S.size.h/lastSize.h;
 [...S.pages.filter(p=>p.type!='card').flatMap(p=>p.els),...S.master].forEach(x=>{x.x*=a;x.w*=a;x.y*=b;x.h*=b});lastSize={...S.size};draw()}});

const cvs=$('#canvas');
cvs.addEventListener('mousedown',ev=>{
 const hd=ev.target.dataset&&ev.target.dataset.h,el=ev.target.closest&&ev.target.closest('[data-id]'),o=hd?selEl():el&&findEl(el.dataset.id);
 if(!o||(!hd&&o.lk)){sel=null;cropId=null;panel();draw();return}
 if(sel!=o.id)cropId=null;sel=o.id;ev.preventDefault();
 const now=Date.now();if(!hd&&(o.t=='image'||o.t=='logo')&&lastClk.id==o.id&&now-lastClk.t<450){cropId=o.id;lastClk={id:0,t:0}}else lastClk={id:o.id,t:now};
 const sx=ev.clientX,sy=ev.clientY,O={x:o.x,y:o.y,w:o.w,h:o.h},isImg=o.t=='image'||o.t=='logo',isTx=o.t=='text'||o.t=='pf',sz0=o.size,c0=isImg?crop(o):null,pg=SZ(S.pages[cur]);
 const mvf=m=>{const dx=(m.clientX-sx)/(PX*Z),dy=(m.clientY-sy)/(PX*Z);
  if(hd&&isTx){
   if(hd.length==2){const k=Math.max(.2,(O.w+(hd.includes('w')?-dx:dx))/O.w);o.size=Math.max(4,r1(sz0*k));o.x=r1(hd.includes('w')?O.x+O.w-O.w*k:O.x);o.y=r1(hd.includes('n')?O.y+O.h-O.h*k:O.y);if(!o.hug)o.w=r1(O.w*k)}
   else{o.hug=0;const w=Math.max(8,O.w+(hd=='e'?dx:-dx));o.w=r1(w);if(hd=='w')o.x=r1(O.x+O.w-w)}}
  else if(hd){let x=O.x,y=O.y,w=O.w,h=O.h;
   if(hd.includes('e'))w=O.w+dx;if(hd.includes('s'))h=O.h+dy;if(hd.includes('w')){w=O.w-dx;x=O.x+dx}if(hd.includes('n')){h=O.h-dy;y=O.y+dy}
   if(w<3){if(hd.includes('w'))x-=3-w;w=3}if(h<3){if(hd.includes('n'))y-=3-h;h=3}
   const uni=isImg&&hd.length==2&&o.lock&&cropId!=o.id;
   if(uni){const k=Math.max(w/O.w,h/O.h);w=O.w*k;h=O.h*k;if(hd.includes('w'))x=O.x+O.w-w;if(hd.includes('n'))y=O.y+O.h-h}
   Object.assign(o,{x:r1(x),y:r1(y),w:r1(w),h:r1(h)});
   if(isImg&&!uni)Object.assign(o,{cx:(c0.cx*O.w-(o.x-O.x))/o.w,cy:(c0.cy*O.h-(o.y-O.y))/o.h,cw:c0.cw*O.w/o.w,ch:c0.ch*O.h/o.h})}
  else if(cropId==o.id){let cx=c0.cx+dx/o.w,cy=c0.cy+dy/o.h;if(c0.cw>=1)cx=Math.min(0,Math.max(1-c0.cw,cx));if(c0.ch>=1)cy=Math.min(0,Math.max(1-c0.ch,cy));Object.assign(o,{cx,cy,cw:c0.cw,ch:c0.ch})}
  else{let x=O.x+dx,y=O.y+dy;for(const t of[0,(pg.w-O.w)/2,pg.w-O.w])if(Math.abs(x-t)<1.2)x=t;for(const t of[0,(pg.h-O.h)/2,pg.h-O.h])if(Math.abs(y-t)<1.2)y=t;o.x=r1(x);o.y=r1(y)}
  draw()};
 const up=()=>{removeEventListener('mousemove',mvf);removeEventListener('mouseup',up);panel()};
 addEventListener('mousemove',mvf);addEventListener('mouseup',up);panel();draw()});
cvs.addEventListener('dblclick',ev=>{const el=ev.target.closest('[data-id]'),o=el&&findEl(el.dataset.id);if(o&&!o.lk&&(o.t=='image'||o.t=='logo')){sel=o.id;cropId=o.id;panel();draw()}});
addEventListener('keydown',ev=>{const tg=ev.target.tagName,ed=tg=='TEXTAREA'||(tg=='INPUT'&&/text|number|search/.test(ev.target.type||'text'));
 if(fpK!==null&&ev.key=='Escape'){fpClose(0);return}
 if((ev.ctrlKey||ev.metaKey)&&!ed){const k=ev.key.toLowerCase();if(k=='z'){ev.shiftKey?redo():undo();ev.preventDefault();return}if(k=='y'){redo();ev.preventDefault();return}}
 if(/INPUT|TEXTAREA|SELECT/.test(tg))return;const o=selEl();
 if(ev.key=='Escape'){cropId=null;sel=null;panel();draw();return}
 if(!o)return;if(ev.key=='Delete'){delEl();return}
 if((ev.key=='c'||ev.key=='C')&&(o.t=='image'||o.t=='logo')&&!ev.ctrlKey){cropOn();return}
 const d=ev.shiftKey?5:.5,m={ArrowLeft:['x',-d],ArrowRight:['x',d],ArrowUp:['y',-d],ArrowDown:['y',d]}[ev.key];
 if(m&&!o.lk){o[m[0]]=r1(o[m[0]]+m[1]);draw();panel();ev.preventDefault()}});
function fpRender(q){q=(q||'').toLowerCase();fpC=fpL.filter(f=>fname(f).toLowerCase().includes(q));fpI=-1;$('#fpv').innerHTML=fpC.map((f,i)=>`<div class="fi ${f==fpO?'cur':''}" data-i="${i}" style="font-family:${fnt(f)}">${esc(fname(f))}</div>`).join('')}
function fpOpen(k,sp){fpK=k;fpO=get(k);fpL=[...(sp?['@h','@b']:[]),...fonts];$('#fpl').style.display='flex';$('#fps').value='';fpRender('');$('#fps').focus();const c=$('#fpv').querySelector('.cur');if(c)c.scrollIntoView({block:'center'})}
function fpClose(ok){if(fpK===null)return;if(!ok)set(fpK,fpO);fpK=null;$('#fpl').style.display='none';panel();draw()}
function fpHi(i,ns){[...$('#fpv').children].forEach((c,j)=>c.classList.toggle('on',j==i));const c=$('#fpv').children[i];if(c&&!ns)c.scrollIntoView({block:'nearest'});set(fpK,fpC[i]);draw()}
function fpKey(e){if(e.key=='Escape'){fpClose(0);return}if(e.key=='Enter'){if(fpC[fpI]!==undefined){set(fpK,fpC[fpI]);fpClose(1)}return}
 if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();fpI=e.key=='ArrowDown'?Math.min(fpC.length-1,fpI+1):Math.max(0,fpI-1);if(fpC.length)fpHi(fpI)}}
let mx=0,my=0;
$('#fpv').addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
$('#fpv').addEventListener('mouseover',e=>{const n=e.target.closest('.fi');if(n&&+n.dataset.i!==fpI){fpI=+n.dataset.i;fpHi(fpI,1)}});
$('#fpv').addEventListener('scroll',()=>{const n=document.elementFromPoint(mx,my),f=n&&n.closest&&n.closest('.fi');if(f&&+f.dataset.i!==fpI){fpI=+f.dataset.i;fpHi(fpI,1)}});
$('#fpv').addEventListener('click',e=>{const n=e.target.closest('.fi');if(n){set(fpK,fpC[+n.dataset.i]);fpClose(1)}});
document.addEventListener('mousedown',e=>{if(fpK!==null&&!e.target.closest('#fpl')&&!e.target.closest('.fpb'))fpClose(0)});
addEventListener('resize',draw);
(async()=>{try{fonts=(await api.fonts()).sort()}catch{}
 const j=await api.load();if(j)load(j);else S.pages=defaults();
 mig();lastSize={...S.size};await measureAll();commit();panel();draw()})();
</script></body></html>
