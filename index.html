<!doctype html>
<html><head><meta charset="utf-8"><title>Catalogue Maker</title>
<style>

#rail button.on{background:var(--ac);border-color:var(--ac);color:#fff}#rail button.on small{color:#dbeafe}

.el.pth{overflow:visible;pointer-events:none}

.el.pth path.hit{pointer-events:stroke}.el.pth path.f{pointer-events:visibleFill}

.nd,.hn{position:absolute;pointer-events:auto;width:var(--hs);height:var(--hs);margin:calc(var(--hs)/-2) 0 0 calc(var(--hs)/-2);background:#fff;border:calc(var(--hs)/8) solid #2563eb;cursor:pointer}
.nd.on{background:#2563eb}.hn{border-radius:50%;width:calc(var(--hs)*.8);height:calc(var(--hs)*.8);margin:calc(var(--hs)/-2.5) 0 0 calc(var(--hs)/-2.5)}
#tr{position:fixed;inset:0;z-index:60;background:#f3f4f6;display:none;flex-direction:column}
.trh{height:48px;background:#111827;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}.trh b{margin-right:6px}.trh span{margin-right:auto;font-size:12px;color:#cbd5e1}
.trh button{background:#1f2937;border-color:#374151;color:#e5e7eb}
.trb{flex:1;display:grid;grid-template-columns:290px 1fr 1fr;min-height:0}
.trside{background:#fff;border-right:1px solid var(--bd);padding:12px;overflow:auto}

<aside class="side ui" id="R"></aside>

<div class="trb"><aside class="trside">
<p><button class="pri" onclick="$('#trf').click()">Choose / replace picture</button><input type="file" id="trf" hidden accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" onchange="trPick(this)"></p>

<div id="trw_bw" style="display:none"><label>Threshold (0 - 255)</label><div class="pair"><input type="range" min="0" max="255" value="128" data-tr="threshold"><input type="number" min="0" max="255" value="128" data-tr="threshold"></div></div>
<div id="trw_c"><label>Colours (2 - 64)</label><div class="pair"><input type="range" min="2" max="64" value="8" data-tr="colors"><input type="number" min="2" max="64" value="8" data-tr="colors"></div></div>

<label>Detail (more points)</label><div class="pair"><input type="range" min="0" max="100" value="60" data-tr="detail"><input type="number" min="0" max="100" value="60" data-tr="detail"></div>
<label>Noise removal</label><div class="pair"><input type="range" min="0" max="100" value="20" data-tr="noise"><input type="number" min="0" max="100" value="20" data-tr="noise"></div>

<p id="trst" class="hint"></p>
<div class="sm"><button class="pri" onclick="trInsert()">Insert into canvas</button><button onclick="trExport()">Export SVG</button><button onclick="trReset()">Reset trace</button><button onclick="trRun(0)">Reprocess</button></div>
</aside>
<section class="trpane" id="trpo"><div class="trt"><b>Original</b><span id="tro"></span><span class="zb"><button onclick="trZ('o',1.25)">+</button><button onclick="trZ('o',.8)">&minus;</button><button onclick="trFit('o')">Fit</button><button onclick="trZ('o',0)">100%</button></span></div><div class="trv" id="trvo"><div id="trio"></div></div></section>
<section class="trpane" id="trpv"><div class="trt"><b>Vector</b><label class="rd"><input type="checkbox" id="trsync" checked> Sync zoom</label><span class="zb"><button onclick="trZ('v',1.25)">+</button><button onclick="trZ('v',.8)">&minus;</button><button onclick="trFit('v')">Fit</button><button onclick="trZ('v',0)">100%</button></span></div><div class="trv chk" id="trvv"><div id="trvec"></div></div></section>
</div></div>
<div id="tb" class="ui"></div>
<div id="fpl" class="ui"><input id="fps" placeholder="Type to search fonts, scroll to preview" oninput="fpRender(this.value,1)" onkeydown="fpKey(event)"><div class="fph"><span id="fpc"></span><button onclick="fpRefresh()">Refresh list</button></div><div id="fpv"></div></div>
