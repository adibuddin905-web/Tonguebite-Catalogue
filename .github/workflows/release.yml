name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build and publish (version is set automatically)
        shell: bash
        run: npx electron-builder --win --publish always -c.extraMetadata.version=1.${{ github.run_number }}.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
